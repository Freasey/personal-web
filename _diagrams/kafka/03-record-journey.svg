<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 920" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
  </defs>

  <rect width="780" height="920" fill="url(#bg3)"/>

  <text x="60" y="58" fill="#f1f5f9" font-size="32" font-weight="700">A single record's journey</text>
  <text x="60" y="90" fill="#94a3b8" font-size="17">From one change in Odoo to an upsert in the destination</text>

  <!-- step boxes: x=150 w=480 h=80, top y = 120 + i*110 -->
  <!-- vertical connectors -->
  <g stroke="#6366f1" stroke-width="2">
    <line x1="390" y1="200" x2="390" y2="228" marker-end="url(#d)"/>
    <line x1="390" y1="310" x2="390" y2="338" marker-end="url(#d)"/>
    <line x1="390" y1="420" x2="390" y2="448" marker-end="url(#d)"/>
    <line x1="390" y1="530" x2="390" y2="558" marker-end="url(#d)"/>
    <line x1="390" y1="640" x2="390" y2="668" marker-end="url(#d)"/>
    <line x1="390" y1="750" x2="390" y2="778" marker-end="url(#d)"/>
  </g>

  <!-- step 1 -->
  <g>
    <rect x="150" y="120" width="480" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
    <circle cx="186" cy="160" r="16" fill="#1e1b3a" stroke="#6366f1"/><text x="186" y="166" fill="#a5b4fc" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="222" y="154" fill="#e2e8f0" font-size="18" font-weight="600">Field changes in Odoo</text>
    <text x="222" y="178" fill="#94a3b8" font-size="14">e.g. a res_partner record is updated</text>
  </g>
  <!-- step 2 -->
  <g>
    <rect x="150" y="230" width="480" height="80" rx="12" fill="#141a2e" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="186" cy="270" r="16" fill="#0e2230" stroke="#22d3ee"/><text x="186" y="276" fill="#67e8f9" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="222" y="264" fill="#e2e8f0" font-size="18" font-weight="600">Trigger → shadow table</text>
    <text x="222" y="288" fill="#94a3b8" font-size="14">row inserted, is_consumed = false</text>
  </g>
  <!-- step 3 -->
  <g>
    <rect x="150" y="340" width="480" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
    <circle cx="186" cy="380" r="16" fill="#1e1b3a" stroke="#6366f1"/><text x="186" y="386" fill="#a5b4fc" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="222" y="374" fill="#e2e8f0" font-size="18" font-weight="600">Kafka Connect publishes</text>
    <text x="222" y="398" fill="#94a3b8" font-size="14">Debezium change event → topic</text>
  </g>
  <!-- step 4 -->
  <g>
    <rect x="150" y="450" width="480" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
    <circle cx="186" cy="490" r="16" fill="#1e1b3a" stroke="#6366f1"/><text x="186" y="496" fill="#a5b4fc" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="222" y="484" fill="#e2e8f0" font-size="18" font-weight="600">Consumer polls message</text>
    <text x="222" y="508" fill="#94a3b8" font-size="14">reads op = c / u / d, skips deletes</text>
  </g>
  <!-- step 5 -->
  <g>
    <rect x="150" y="560" width="480" height="80" rx="12" fill="#141a2e" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="186" cy="600" r="16" fill="#0e2230" stroke="#22d3ee"/><text x="186" y="606" fill="#67e8f9" font-size="16" font-weight="700" text-anchor="middle">5</text>
    <text x="222" y="594" fill="#e2e8f0" font-size="18" font-weight="600">Transform</text>
    <text x="222" y="618" fill="#94a3b8" font-size="14">resolve FKs · map company code · localize jsonb</text>
  </g>
  <!-- step 6 -->
  <g>
    <rect x="150" y="670" width="480" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
    <circle cx="186" cy="710" r="16" fill="#1e1b3a" stroke="#6366f1"/><text x="186" y="716" fill="#a5b4fc" font-size="16" font-weight="700" text-anchor="middle">6</text>
    <text x="222" y="704" fill="#e2e8f0" font-size="18" font-weight="600">Upsert into destination DB</text>
    <text x="222" y="728" fill="#94a3b8" font-size="14">insert or update, matched by external_id</text>
  </g>
  <!-- step 7 -->
  <g>
    <rect x="150" y="780" width="480" height="80" rx="12" fill="#141a2e" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="186" cy="820" r="16" fill="#0f2620" stroke="#34d399"/><text x="186" y="826" fill="#6ee7b7" font-size="16" font-weight="700" text-anchor="middle">7</text>
    <text x="222" y="814" fill="#e2e8f0" font-size="18" font-weight="600">Mark shadow row consumed</text>
    <text x="222" y="838" fill="#94a3b8" font-size="14">is_consumed = true — or error_msg on failure</text>
  </g>
</svg>
