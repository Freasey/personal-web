<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="kafka" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b3a"/>
      <stop offset="1" stop-color="#16233a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>

  <text x="60" y="66" fill="#f1f5f9" font-size="34" font-weight="700">Topic topology</text>
  <text x="60" y="98" fill="#94a3b8" font-size="18">Multiple ERP systems syncing through one Kafka backbone</text>

  <!-- column labels -->
  <text x="125" y="150" fill="#64748b" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">SOURCES</text>
  <text x="590" y="150" fill="#64748b" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">BACKBONE</text>
  <text x="1100" y="150" fill="#64748b" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">DESTINATIONS</text>

  <!-- connecting lines: sources -> kafka(left 480, center y 410) -->
  <g stroke-width="1.6" opacity="0.55">
    <line x1="210" y1="192" x2="480" y2="410" stroke="#475569"/>
    <line x1="210" y1="265" x2="480" y2="410" stroke="#475569"/>
    <line x1="210" y1="338" x2="480" y2="410" stroke="#475569"/>
    <line x1="210" y1="411" x2="480" y2="410" stroke="#475569"/>
    <line x1="210" y1="484" x2="480" y2="410" stroke="#475569"/>
    <line x1="210" y1="557" x2="480" y2="410" stroke="#475569"/>
  </g>
  <!-- kafka(right 700, center 410) -> destinations -->
  <g stroke-width="1.6" opacity="0.55">
    <line x1="700" y1="410" x2="980" y2="200" stroke="#475569"/>
    <line x1="700" y1="410" x2="980" y2="285" stroke="#475569"/>
    <line x1="700" y1="410" x2="980" y2="370" stroke="#475569"/>
    <line x1="700" y1="410" x2="980" y2="455" stroke="#475569"/>
    <line x1="700" y1="410" x2="980" y2="540" stroke="#475569"/>
  </g>

  <!-- source boxes (x=40 w=170 h=55, centers at y) -->
  <g font-size="16" font-weight="600">
    <rect x="40" y="165" width="170" height="55" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="125" y="198" fill="#e2e8f0" text-anchor="middle">PIS</text>
    <rect x="40" y="238" width="170" height="55" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="125" y="271" fill="#e2e8f0" text-anchor="middle">IGR</text>
    <rect x="40" y="311" width="170" height="55" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="125" y="344" fill="#e2e8f0" text-anchor="middle">KingPack</text>
    <rect x="40" y="384" width="170" height="55" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="125" y="417" fill="#e2e8f0" text-anchor="middle">CRM</text>
    <rect x="40" y="457" width="170" height="55" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="125" y="490" fill="#e2e8f0" text-anchor="middle">HRIS</text>
    <rect x="40" y="530" width="170" height="55" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="125" y="563" fill="#e2e8f0" text-anchor="middle">WMS</text>
  </g>

  <!-- kafka center box -->
  <rect x="480" y="180" width="220" height="460" rx="16" fill="url(#kafka)" stroke="#6366f1" stroke-width="2"/>
  <text x="590" y="392" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="middle">Apache Kafka</text>
  <text x="590" y="422" fill="#a5b4fc" font-size="15" text-anchor="middle">per-table CDC topics</text>
  <text x="590" y="446" fill="#94a3b8" font-size="14" text-anchor="middle">one consumer per topic</text>

  <!-- destination boxes (x=980 w=240 h=70, centers at y) -->
  <g>
    <rect x="980" y="165" width="240" height="70" rx="10" fill="#141a2e" stroke="#22d3ee"/><text x="1100" y="197" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">CRM database</text><text x="1100" y="218" fill="#94a3b8" font-size="12" text-anchor="middle">partners · teams · users</text>
    <rect x="980" y="250" width="240" height="70" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="1100" y="282" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Portal back-office</text><text x="1100" y="303" fill="#94a3b8" font-size="12" text-anchor="middle">users · access</text>
    <rect x="980" y="335" width="240" height="70" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="1100" y="367" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">WMS database</text><text x="1100" y="388" fill="#94a3b8" font-size="12" text-anchor="middle">products · stock · pickings</text>
    <rect x="980" y="420" width="240" height="70" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="1100" y="452" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Firebase push</text><text x="1100" y="473" fill="#94a3b8" font-size="12" text-anchor="middle">mobile notifications</text>
    <rect x="980" y="505" width="240" height="70" rx="10" fill="#141a2e" stroke="#2a3350"/><text x="1100" y="537" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">WhatsApp</text><text x="1100" y="558" fill="#94a3b8" font-size="12" text-anchor="middle">alerts · messaging</text>
  </g>

  <text x="60" y="690" fill="#475569" font-size="14">Each topic is named for its source table; a dedicated consumer transforms and routes it to the right destination.</text>
</svg>
