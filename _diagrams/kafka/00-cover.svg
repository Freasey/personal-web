<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0c1226"/>
      <stop offset="1" stop-color="#0e1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#cbg)"/>

  <!-- left: title block -->
  <text x="72" y="262" fill="#67e8f9" font-size="18" font-weight="600" letter-spacing="4">EVENT-DRIVEN · CDC</text>
  <text x="70" y="338" fill="#f8fafc" font-size="68" font-weight="800">Kafka ERP</text>
  <text x="70" y="410" fill="#f8fafc" font-size="68" font-weight="800">Data Sync</text>
  <text x="72" y="460" fill="#94a3b8" font-size="22">Near real-time sync across Odoo ERP databases</text>

  <!-- tech chips -->
  <g font-size="15" fill="#cbd5e1" font-weight="500">
    <rect x="72" y="500" width="132" height="36" rx="18" fill="#141a2e" stroke="#2a3350"/><text x="138" y="524" text-anchor="middle">Apache Kafka</text>
    <rect x="216" y="500" width="108" height="36" rx="18" fill="#141a2e" stroke="#2a3350"/><text x="270" y="524" text-anchor="middle">Debezium</text>
    <rect x="336" y="500" width="92" height="36" rx="18" fill="#141a2e" stroke="#2a3350"/><text x="382" y="524" text-anchor="middle">Python</text>
    <rect x="440" y="500" width="124" height="36" rx="18" fill="#141a2e" stroke="#2a3350"/><text x="502" y="524" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- right: DBs -> Kafka -> apps motif -->
  <circle cx="965" cy="360" r="170" fill="url(#glow)"/>

  <!-- connection lines (sources -> hub) -->
  <g stroke="url(#flow)" stroke-width="2.5" opacity="0.7" fill="none">
    <path d="M 852 250 C 895 250, 895 360, 905 360"/>
    <path d="M 852 360 L 905 360"/>
    <path d="M 852 470 C 895 470, 895 360, 905 360"/>
  </g>
  <!-- connection lines (hub -> destinations) -->
  <g stroke="url(#flow)" stroke-width="2.5" opacity="0.7" fill="none">
    <path d="M 1025 360 C 1075 360, 1075 268, 1118 268"/>
    <path d="M 1025 360 L 1118 360"/>
    <path d="M 1025 360 C 1075 360, 1075 452, 1118 452"/>
  </g>
  <!-- moving dots -->
  <g fill="#67e8f9">
    <circle cx="880" cy="305" r="4"/><circle cx="880" cy="360" r="4"/><circle cx="880" cy="415" r="4"/>
  </g>
  <g fill="#a5b4fc">
    <circle cx="1075" cy="313" r="4"/><circle cx="1075" cy="360" r="4"/><circle cx="1075" cy="407" r="4"/>
  </g>

  <!-- source DB cylinders -->
  <g>
    <g transform="translate(790,222)">
      <path d="M0,8 a31,8 0 0,1 62,0 l0,52 a31,8 0 0,1 -62,0 z" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
      <ellipse cx="31" cy="8" rx="31" ry="8" fill="#1b2540" stroke="#334066" stroke-width="1.5"/>
    </g>
    <g transform="translate(790,332)">
      <path d="M0,8 a31,8 0 0,1 62,0 l0,52 a31,8 0 0,1 -62,0 z" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
      <ellipse cx="31" cy="8" rx="31" ry="8" fill="#1b2540" stroke="#334066" stroke-width="1.5"/>
    </g>
    <g transform="translate(790,442)">
      <path d="M0,8 a31,8 0 0,1 62,0 l0,52 a31,8 0 0,1 -62,0 z" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
      <ellipse cx="31" cy="8" rx="31" ry="8" fill="#1b2540" stroke="#334066" stroke-width="1.5"/>
    </g>
    <text x="754" y="180" fill="#64748b" font-size="14" font-weight="600" letter-spacing="1">ERP DBs</text>
  </g>

  <!-- Kafka hub -->
  <rect x="905" y="300" width="120" height="120" rx="22" fill="url(#hub)" stroke="#818cf8" stroke-width="2"/>
  <text x="965" y="356" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Kafka</text>
  <text x="965" y="380" fill="#c7d2fe" font-size="13" text-anchor="middle">CDC topics</text>

  <!-- destination app tiles -->
  <g>
    <rect x="1118" y="236" width="64" height="64" rx="14" fill="#141a2e" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="1118" y="328" width="64" height="64" rx="14" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
    <rect x="1118" y="420" width="64" height="64" rx="14" fill="#141a2e" stroke="#2a3350" stroke-width="1.5"/>
    <text x="1150" y="530" fill="#64748b" font-size="14" font-weight="600" letter-spacing="1" text-anchor="middle">Apps · DBs</text>
  </g>
</svg>
