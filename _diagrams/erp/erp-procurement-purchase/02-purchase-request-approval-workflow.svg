  <text x="64" y="66" fill="#f1f5f9" font-size="32" font-weight="700">Purchase request approval workflow</text><text x="64" y="100" fill="#94a3b8" font-size="18">Two-tier department approval before a PO is raised</text><rect x="70" y="300" width="165" height="82" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="152.5" y="347" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Draft</text><line x1="235" y1="341" x2="262" y2="341" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="265" y="300" width="165" height="82" rx="12" fill="#141a2e" stroke="#38bdf8" stroke-width="1.6"/><text x="347.5" y="338" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Waiting 1</text><text x="347.5" y="359" fill="#94a3b8" font-size="12.5" text-anchor="middle">department</text><line x1="430" y1="341" x2="457" y2="341" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="460" y="300" width="165" height="82" rx="12" fill="#141a2e" stroke="#38bdf8" stroke-width="1.6"/><text x="542.5" y="338" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Waiting 2</text><text x="542.5" y="359" fill="#94a3b8" font-size="12.5" text-anchor="middle">director</text><line x1="625" y1="341" x2="652" y2="341" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="655" y="300" width="165" height="82" rx="12" fill="#141a2e" stroke="#38bdf8" stroke-width="1.6"/><text x="737.5" y="347" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Approved</text><line x1="820" y1="341" x2="847" y2="341" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="850" y="300" width="165" height="82" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="932.5" y="338" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Process</text><text x="932.5" y="359" fill="#94a3b8" font-size="12.5" text-anchor="middle">PO raised</text><line x1="1015" y1="341" x2="1042" y2="