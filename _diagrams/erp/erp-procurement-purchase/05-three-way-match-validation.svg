<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0d1326"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#f43f5e"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="66" fill="#f1f5f9" font-size="32" font-weight="700">Three-way match validation</text><text x="64" y="100" fill="#94a3b8" font-size="18">A vendor bill posts only when PO, receipt and invoice quantities agree</text><rect x="110" y="200" width="200" height="70" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="210" y="241" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">PO qty</text><rect x="110" y="305" width="200" height="70" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="210" y="346" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Receipt qty</text><rect x="110" y="410" width="200" height="70" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="210" y="451" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Invoice qty</text><circle cx="560" cy="340" r="62" fill="#141a2e" stroke="#38bdf8" stroke-width="2"/><text x="560" y="335" fill="#e2e8f0" font-size="17" font-weight="700" text-anchor="middle">= ?</text><text x="560" y="358" fill="#94a3b8" font-size="12" text-anchor="middle">quantities</text><line x1="310" y1="235" x2="505" y2="320" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><line x1="310" y1="340" x2="498" y2="340" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><line x1="310" y1="445" x2="505" y2="360" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="820" y="250" width="250" height="70" rx="12" fill="#10261d" stroke="#34d399" stroke-width="1.6"/><text x="945" y="291" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Post vendor bill</text><rect x="820" y="380" width="250" height="70" rx="12" fill="#1a1320" stroke="#f43f5e" stroke-width="1.6"/><text x="945" y="412" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Blocked</text><text x="945" y="433" fill="#94a3b8" font-size="12.5" text-anchor="middle">quantities disagree</text><line x1="622" y1="320" x2="818" y2="290" stroke="#38bdf8" stroke-width="2"  marker-end="url(#aA)"/><text x="720" y="270" fill="#38bdf8" font-size="13" text-anchor="middle">match</text><line x1="622" y1="365" x2="818" y2="410" stroke="#f43f5e" stroke-width="2"  marker-end="url(#aR)"/><text x="720" y="430" fill="#fb7185" font-size="13" text-anchor="middle">mismatch</text>
</svg>