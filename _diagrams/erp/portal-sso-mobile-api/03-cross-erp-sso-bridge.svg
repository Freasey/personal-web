  <text x="64" y="66" fill="#f1f5f9" font-size="32" font-weight="700">Cross-ERP single sign-on</text><text x="64" y="100" fill="#94a3b8" font-size="18">One token, validated by each ERP client, unlocks every connected system</text><rect x="500" y="150" width="280" height="96" rx="12" fill="#141a2e" stroke="#fb7185" stroke-width="1.6"/><text x="640" y="195" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">SSO server</text><text x="640" y="216" fill="#94a3b8" font-size="12.5" text-anchor="middle">token authority</text><rect x="90" y="300" width="200" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="190" y="337" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">User login</text><text x="190" y="358" fill="#94a3b8" font-size="12.5" text-anchor="middle">one sign-on</text><line x1="290" y1="340" x2="498" y2="230" stroke="#fb7185" stroke-width="2"  marker-end="url(#aA)"/><text x="370" y="250" fill="#fb7185" font-size="13" text-anchor="middle">authenticate</text><rect x="200" y="460" width="200" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="300" y="497" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">ERP A</text><text x="300" y="518" fill="#94a3b8" font-size="12.5" text-anchor="middle">sso_client</text><path d="M 300 460 C 300 380, 640 340, 640 248" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/><rect x="540" y="460" width="200" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="640" y="497" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">ERP B</text><text x="640" y="518" fill="#94a3b8" font-size="12.5" text-anchor="middle">sso_client</text><path d="M 640 460 C 640 380, 640 340, 640 248" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/><rect x="880" y="460" width="200" height="80" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="980" y="497" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">ERP C</text><text x="980" y="518" fill="#94a3b8" font-size="12.5" text-anchor="middle">sso_client</text><path d="M 980 460 C 980 380, 640 340, 640 248" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/><text x="870" y="360" fill="#64748b" font-size="13" text-anchor="middle">validate token (XML-RPC)</text>
