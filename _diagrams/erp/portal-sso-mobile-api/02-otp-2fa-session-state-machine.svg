<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0d1326"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#fb7185"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#f43f5e"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="66" fill="#f1f5f9" font-size="32" font-weight="700">OTP / 2FA session states</text><text x="64" y="100" fill="#94a3b8" font-size="18">A session activates on valid OTP and freezes on repeated failures</text><rect x="120" y="305" width="200" height="80" rx="12" fill="#141a2e" stroke="#fb7185" stroke-width="1.6"/><text x="220" y="342" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Unverified</text><text x="220" y="363" fill="#94a3b8" font-size="12.5" text-anchor="middle">after password</text><rect x="560" y="200" width="200" height="76" rx="12" fill="#10261d" stroke="#34d399" stroke-width="1.6"/><text x="660" y="235" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Active</text><text x="660" y="256" fill="#94a3b8" font-size="12.5" text-anchor="middle">session valid</text><rect x="560" y="405" width="200" height="76" rx="12" fill="#1a1320" stroke="#f43f5e" stroke-width="1.6"/><text x="660" y="440" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Frozen</text><text x="660" y="461" fill="#94a3b8" font-size="12.5" text-anchor="middle">locked out</text><rect x="900" y="200" width="200" height="76" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="1000" y="235" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Expired</text><text x="1000" y="256" fill="#94a3b8" font-size="12.5" text-anchor="middle">timed out</text><line x1="320" y1="320" x2="558" y2="250" stroke="#fb7185" stroke-width="2"  marker-end="url(#aA)"/><text x="440" y="255" fill="#fb7185" font-size="13" text-anchor="middle">valid OTP</text><line x1="320" y1="365" x2="558" y2="435" stroke="#f43f5e" stroke-width="2"  marker-end="url(#aR)"/><text x="440" y="425" fill="#fb7185" font-size="13" text-anchor="middle">failed × N</text><line x1="760" y1="238" x2="898" y2="238" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><text x="829" y="225" fill="#64748b" font-size="13" text-anchor="middle">timeout</text><path d="M 560 455 C 430 500, 320 470, 240 387" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="400" y="505" fill="#64748b" font-size="13" text-anchor="middle">after cooldown</text>
</svg>