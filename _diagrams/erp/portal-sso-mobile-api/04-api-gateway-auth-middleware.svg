<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0d1326"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#fb7185"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#f43f5e"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="66" fill="#f1f5f9" font-size="32" font-weight="700">API gateway auth middleware</text><text x="64" y="100" fill="#94a3b8" font-size="18">Every request is authenticated, authorized, executed and logged</text><rect x="105" y="290" width="190" height="86" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="200" y="330" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Request</text><text x="200" y="351" fill="#94a3b8" font-size="12.5" text-anchor="middle">Id/Secret + User</text><line x1="295" y1="333" x2="322" y2="333" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="325" y="290" width="190" height="86" rx="12" fill="#141a2e" stroke="#fb7185" stroke-width="1.6"/><text x="420" y="330" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">checkAuth</text><text x="420" y="351" fill="#94a3b8" font-size="12.5" text-anchor="middle">verify keys</text><line x1="515" y1="333" x2="542" y2="333" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="545" y="290" width="190" height="86" rx="12" fill="#141a2e" stroke="#fb7185" stroke-width="1.6"/><text x="640" y="330" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">authorizedUser</text><text x="640" y="351" fill="#94a3b8" font-size="12.5" text-anchor="middle">resolve roles</text><line x1="735" y1="333" x2="762" y2="333" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="765" y="290" width="190" height="86" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="860" y="330" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">API handler</text><text x="860" y="351" fill="#94a3b8" font-size="12.5" text-anchor="middle">execute</text><line x1="955" y1="333" x2="982" y2="333" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><rect x="985" y="290" width="190" height="86" rx="12" fill="#10261d" stroke="#34d399" stroke-width="1.6"/><text x="1080" y="330" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Response</text><text x="1080" y="351" fill="#94a3b8" font-size="12.5" text-anchor="middle">logged</text><rect x="325" y="470" width="320" height="60" rx="12" fill="#1a1320" stroke="#f43f5e" stroke-width="1.6"/><text x="485" y="506" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">401 + WhatsApp alert</text><line x1="420" y1="376" x2="450" y2="470" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aR)"/><line x1="640" y1="376" x2="610" y2="470" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aR)"/><text x="530" y="560" fill="#fb7185" font-size="13" text-anchor="middle">auth failure → reject and alert</text>
</svg>