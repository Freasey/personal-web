  <text x="64" y="66" fill="#f1f5f9" font-size="32" font-weight="700">Delivery request → external WMS sync</text><text x="64" y="100" fill="#94a3b8" font-size="18">Confirmed delivery requests sync over XML-RPC, driven by a cron worker</text><rect x="80" y="280" width="240" height="92" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="200" y="323" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">ERP</text><text x="200" y="344" fill="#94a3b8" font-size="12.5" text-anchor="middle">delivery confirmed</text><text x="200" y="405" fill="#94a3b8" font-size="13" text-anchor="middle">request.delivery created</text><rect x="490" y="280" width="300" height="92" rx="12" fill="#141a2e" stroke="#22d3ee" stroke-width="1.6"/><text x="640" y="323" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Sync worker</text><text x="640" y="344" fill="#94a3b8" font-size="12.5" text-anchor="middle">cron · XML-RPC</text><rect x="960" y="280" width="240" height="92" rx="12" fill="#141a2e" stroke="#2a3350" stroke-width="1.6"/><text x="1080" y="323" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">External WMS</text><text x="1080" y="344" fill="#94a3b8" font-size="12.5" text-anchor="middle">insert / update</text><line x1="320" y1="325" x2="487" y2="325" stroke="#475569" stroke-width="2"  marker-end="url(#a)"/><text x="403" y="312" fill="#64748b" font-size="13" text-anchor="middle">queued request</text><line x1="790" y1="310" x2="957" y2="310" stroke="#22d3ee" stroke-width="2"  marker-end="url(#aA)"/><text x="873" y="297" fill="#22d3ee" font-size="13" text-anchor="middle">push insert / update</text><path d="M 960 360 C 873 430, 403 430, 322 372" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="640" y="445" fill="#64748b" font-size="13" text-anchor="middle">status synced back</text>
