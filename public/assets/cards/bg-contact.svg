<svg width="630" height="270" viewBox="0 0 630 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cBgA" cx="18%" cy="55%" r="58%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cBgB" cx="82%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FDBA74" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cBgC" cx="60%" cy="92%" r="45%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cNodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FB923C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mesh gradient background -->
  <rect width="630" height="270" fill="url(#cBgA)"/>
  <rect width="630" height="270" fill="url(#cBgB)"/>
  <rect width="630" height="270" fill="url(#cBgC)"/>

  <!-- Concentric ripples from origin -->
  <g fill="none" stroke="#FB923C">
    <circle cx="80" cy="135" r="60"  stroke-opacity="0.14" stroke-width="0.9"/>
    <circle cx="80" cy="135" r="100" stroke-opacity="0.09" stroke-width="0.8"/>
    <circle cx="80" cy="135" r="145" stroke-opacity="0.06" stroke-width="0.7"/>
    <circle cx="80" cy="135" r="200" stroke-opacity="0.04" stroke-width="0.7"/>
  </g>

  <!-- Flowing signal curves -->
  <g fill="none" stroke="#FB923C" stroke-linecap="round">
    <path d="M 50 135 Q 200 50 320 135 T 590 135" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M 50 115 Q 200 35 320 115 T 590 115" stroke-opacity="0.24" stroke-width="1"/>
    <path d="M 50 155 Q 200 70 320 155 T 590 155" stroke-opacity="0.24" stroke-width="1"/>
    <path d="M 50 95  Q 200 20 320 95  T 590 95"  stroke-opacity="0.12" stroke-width="0.85"/>
    <path d="M 50 175 Q 200 90 320 175 T 590 175" stroke-opacity="0.12" stroke-width="0.85"/>
    <path d="M 80 218 Q 220 178 360 200 T 580 180" stroke-opacity="0.2"  stroke-width="0.95"/>
    <path d="M 60 50  Q 200 80 340 65  T 590 80"  stroke-opacity="0.16" stroke-width="0.85"/>
  </g>

  <!-- Origin node (bottom-left) -->
  <circle cx="80" cy="135" r="42" fill="url(#cNodeGlow)"/>
  <circle cx="80" cy="135" r="22" fill="none" stroke="#FB923C" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="80" cy="135" r="13" fill="none" stroke="#FB923C" stroke-opacity="0.55" stroke-width="1.3"/>
  <circle cx="80" cy="135" r="7"  fill="#FED7AA" fill-opacity="0.95"/>

  <!-- Mid nodes -->
  <circle cx="200" cy="75" r="24" fill="url(#cNodeGlow)" opacity="0.72"/>
  <circle cx="200" cy="75" r="10" fill="none" stroke="#FB923C" stroke-opacity="0.38" stroke-width="1"/>
  <circle cx="200" cy="75" r="5"  fill="#FB923C" fill-opacity="0.75"/>

  <circle cx="320" cy="135" r="24" fill="url(#cNodeGlow)" opacity="0.68"/>
  <circle cx="320" cy="135" r="10" fill="none" stroke="#FB923C" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="320" cy="135" r="5"  fill="#FB923C" fill-opacity="0.72"/>

  <circle cx="445" cy="80" r="22" fill="url(#cNodeGlow)" opacity="0.6"/>
  <circle cx="445" cy="80" r="9"  fill="none" stroke="#FDBA74" stroke-opacity="0.32" stroke-width="1"/>
  <circle cx="445" cy="80" r="4.5" fill="#FDBA74" fill-opacity="0.7"/>

  <!-- Destination node (right) -->
  <circle cx="565" cy="135" r="30" fill="url(#cNodeGlow)" opacity="0.78"/>
  <circle cx="565" cy="135" r="20" fill="none" stroke="#FB923C" stroke-opacity="0.22" stroke-width="0.9"/>
  <circle cx="565" cy="135" r="12" fill="none" stroke="#FB923C" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="565" cy="135" r="6"  fill="#FED7AA" fill-opacity="0.9"/>

  <!-- Dashed connection -->
  <line x1="80" y1="135" x2="565" y2="135" stroke="#FB923C" stroke-opacity="0.1" stroke-width="0.9" stroke-dasharray="4 7"/>

  <!-- Scan wave lines (top middle) -->
  <g stroke="#FB923C" fill="none" stroke-linecap="round">
    <line x1="270" y1="42" x2="395" y2="42" stroke-opacity="0.12" stroke-width="0.9"/>
    <line x1="285" y1="54" x2="385" y2="54" stroke-opacity="0.08" stroke-width="0.9"/>
    <line x1="278" y1="66" x2="378" y2="66" stroke-opacity="0.06" stroke-width="0.9"/>
  </g>

  <!-- Scatter particles -->
  <g fill="#FB923C">
    <circle cx="278" cy="200" r="1.5" fill-opacity="0.32"/>
    <circle cx="380" cy="225" r="1.2" fill-opacity="0.26"/>
    <circle cx="510" cy="215" r="1"   fill-opacity="0.22"/>
    <circle cx="155" cy="225" r="1.5" fill-opacity="0.3"/>
    <circle cx="490" cy="40"  r="1"   fill-opacity="0.22"/>
    <circle cx="610" cy="55"  r="1.2" fill-opacity="0.25"/>
    <circle cx="38"  cy="225" r="1.2" fill-opacity="0.3"/>
    <circle cx="25"  cy="55"  r="1"   fill-opacity="0.25"/>
    <circle cx="610" cy="245" r="1"   fill-opacity="0.2"/>
  </g>
  <g fill="#FDBA74">
    <circle cx="240" cy="245" r="1"   fill-opacity="0.2"/>
    <circle cx="420" cy="245" r="1.2" fill-opacity="0.22"/>
    <circle cx="118" cy="36"  r="1"   fill-opacity="0.18"/>
    <circle cx="540" cy="240" r="1"   fill-opacity="0.18"/>
  </g>

  <!-- Corner bracket (bottom-left) -->
  <path d="M10 232 L10 250 L30 250" fill="none" stroke="#FB923C" stroke-opacity="0.32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
