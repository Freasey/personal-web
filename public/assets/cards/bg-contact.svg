<svg width="630" height="270" viewBox="0 0 630 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rg-c" cx="18%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#EF9F27" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EF9F27" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-c2" cx="82%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#FAC775" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FAC775" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="630" height="270" fill="url(#rg-c)"/>
  <rect width="630" height="270" fill="url(#rg-c2)"/>

  <!-- Signal origin — bottom-left -->
  <circle cx="90"  cy="248" r="32"  fill="none" stroke="#EF9F27" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="90"  cy="248" r="65"  fill="none" stroke="#EF9F27" stroke-opacity="0.22" stroke-width="1.2"/>
  <circle cx="90"  cy="248" r="105" fill="none" stroke="#EF9F27" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="90"  cy="248" r="150" fill="none" stroke="#EF9F27" stroke-opacity="0.09" stroke-width="0.8"/>
  <circle cx="90"  cy="248" r="200" fill="none" stroke="#EF9F27" stroke-opacity="0.05" stroke-width="0.8"/>
  <circle cx="90"  cy="248" r="255" fill="none" stroke="#EF9F27" stroke-opacity="0.03" stroke-width="0.8"/>

  <!-- Core dot -->
  <circle cx="90" cy="248" r="7" fill="#EF9F27" fill-opacity="0.45"/>
  <circle cx="90" cy="248" r="3.5" fill="#EF9F27" fill-opacity="0.8"/>

  <!-- Secondary origin — top-right -->
  <circle cx="560" cy="40"  r="22"  fill="none" stroke="#FAC775" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="560" cy="40"  r="50"  fill="none" stroke="#FAC775" stroke-opacity="0.13" stroke-width="1"/>
  <circle cx="560" cy="40"  r="85"  fill="none" stroke="#FAC775" stroke-opacity="0.07" stroke-width="0.8"/>
  <circle cx="560" cy="40"  r="3.5" fill="#FAC775" fill-opacity="0.6"/>

  <!-- Dashed connection line origin → destination -->
  <line x1="90" y1="248" x2="560" y2="40" stroke="#EF9F27" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="5 7"/>

  <!-- Receiver nodes along connection -->
  <circle cx="205" cy="200" r="4.5" fill="#EF9F27" fill-opacity="0.36"/>
  <circle cx="205" cy="200" r="10"  fill="none" stroke="#EF9F27" stroke-opacity="0.18" stroke-width="1"/>

  <circle cx="315" cy="157" r="4"   fill="#EF9F27" fill-opacity="0.27"/>
  <circle cx="315" cy="157" r="9"   fill="none" stroke="#EF9F27" stroke-opacity="0.13" stroke-width="1"/>

  <circle cx="428" cy="112" r="3.5" fill="#FAC775" fill-opacity="0.24"/>
  <circle cx="428" cy="112" r="8"   fill="none" stroke="#FAC775" stroke-opacity="0.11" stroke-width="1"/>

  <!-- Directional arc segments from main origin -->
  <path d="M 36 210 A 70 70 0 0 1 106 175" fill="none" stroke="#EF9F27" stroke-opacity="0.27" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 12 168 A 112 112 0 0 1 124 132" fill="none" stroke="#EF9F27" stroke-opacity="0.17" stroke-width="1" stroke-linecap="round"/>
  <path d="M 5 122 A 162 162 0 0 1 148 80"   fill="none" stroke="#EF9F27" stroke-opacity="0.1"  stroke-width="0.8" stroke-linecap="round"/>

  <!-- Envelope/message outline — upper right area -->
  <rect x="455" y="80" width="155" height="100" rx="8" fill="none" stroke="#EF9F27" stroke-opacity="0.14" stroke-width="1"/>
  <path d="M455 80 L532 136 L610 80" fill="none" stroke="#EF9F27" stroke-opacity="0.1" stroke-width="1"/>
  <!-- envelope bottom flap hint -->
  <path d="M455 180 L510 140 M610 180 L553 140" fill="none" stroke="#EF9F27" stroke-opacity="0.07" stroke-width="0.8"/>

  <!-- Scan wave lines (center area) -->
  <line x1="280" y1="52"  x2="400" y2="52"  stroke="#EF9F27" stroke-opacity="0.1"  stroke-width="1" stroke-linecap="round"/>
  <line x1="295" y1="65"  x2="390" y2="65"  stroke="#EF9F27" stroke-opacity="0.07" stroke-width="1" stroke-linecap="round"/>
  <line x1="285" y1="78"  x2="380" y2="78"  stroke="#EF9F27" stroke-opacity="0.05" stroke-width="1" stroke-linecap="round"/>

  <!-- Scatter dots -->
  <circle cx="480" cy="200" r="2"   fill="#EF9F27" fill-opacity="0.2"/>
  <circle cx="545" cy="215" r="1.5" fill="#EF9F27" fill-opacity="0.15"/>
  <circle cx="210" cy="65"  r="1.5" fill="#FAC775" fill-opacity="0.16"/>
  <circle cx="250" cy="40"  r="1.5" fill="#FAC775" fill-opacity="0.13"/>
  <circle cx="600" cy="160" r="2"   fill="#EF9F27" fill-opacity="0.13"/>
  <circle cx="65"  cy="90"  r="1.5" fill="#EF9F27" fill-opacity="0.18"/>
  <circle cx="170" cy="32"  r="1.5" fill="#FAC775" fill-opacity="0.12"/>
  <circle cx="620" cy="230" r="1.5" fill="#EF9F27" fill-opacity="0.1"/>

  <!-- Corner brackets -->
  <path d="M600 18 L620 18 L620 38" fill="none" stroke="#EF9F27" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10  252 L10  270 L30  270" fill="none" stroke="#EF9F27" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
