<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sBgA" cx="55%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sBgB" cx="15%" cy="82%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sStarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mesh gradient background -->
  <rect width="400" height="400" fill="url(#sBgA)"/>
  <rect width="400" height="400" fill="url(#sBgB)"/>

  <!-- Constellation connecting lines -->
  <g stroke="#A78BFA" fill="none" stroke-linecap="round">
    <line x1="200" y1="150" x2="100" y2="80"  stroke-opacity="0.28" stroke-width="0.9"/>
    <line x1="200" y1="150" x2="305" y2="92"  stroke-opacity="0.3"  stroke-width="0.9"/>
    <line x1="200" y1="150" x2="78"  y2="195" stroke-opacity="0.24" stroke-width="0.9"/>
    <line x1="200" y1="150" x2="330" y2="205" stroke-opacity="0.22" stroke-width="0.9"/>
    <line x1="200" y1="150" x2="148" y2="262" stroke-opacity="0.2"  stroke-width="0.9"/>
    <line x1="200" y1="150" x2="262" y2="268" stroke-opacity="0.2"  stroke-width="0.9"/>

    <line x1="100" y1="80"  x2="78"  y2="195" stroke-opacity="0.14" stroke-width="0.7"/>
    <line x1="305" y1="92"  x2="330" y2="205" stroke-opacity="0.14" stroke-width="0.7"/>
    <line x1="78"  y1="195" x2="148" y2="262" stroke-opacity="0.13" stroke-width="0.7"/>
    <line x1="330" y1="205" x2="262" y2="268" stroke-opacity="0.13" stroke-width="0.7"/>
    <line x1="148" y1="262" x2="262" y2="268" stroke-opacity="0.1"  stroke-width="0.7"/>
  </g>

  <!-- Subtle light rays from central star -->
  <g stroke="#DDD6FE" fill="none" stroke-linecap="round" stroke-opacity="0.14">
    <line x1="200" y1="150" x2="200" y2="48"  stroke-width="0.7"/>
    <line x1="200" y1="150" x2="200" y2="252" stroke-width="0.7"/>
    <line x1="200" y1="150" x2="100" y2="150" stroke-width="0.7"/>
    <line x1="200" y1="150" x2="300" y2="150" stroke-width="0.7"/>
    <line x1="200" y1="150" x2="132" y2="82"  stroke-width="0.55"/>
    <line x1="200" y1="150" x2="268" y2="82"  stroke-width="0.55"/>
    <line x1="200" y1="150" x2="132" y2="218" stroke-width="0.55"/>
    <line x1="200" y1="150" x2="268" y2="218" stroke-width="0.55"/>
  </g>

  <!-- Central star with halo -->
  <circle cx="200" cy="150" r="55" fill="url(#sStarGlow)"/>
  <circle cx="200" cy="150" r="14" fill="none" stroke="#DDD6FE" stroke-opacity="0.55" stroke-width="1.2"/>
  <circle cx="200" cy="150" r="24" fill="none" stroke="#A78BFA" stroke-opacity="0.3"  stroke-width="1"/>
  <circle cx="200" cy="150" r="9"  fill="#DDD6FE" fill-opacity="0.95"/>
  <!-- Sparkle on central -->
  <path d="M200 130 L204 146 L220 150 L204 154 L200 170 L196 154 L180 150 L196 146 Z" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Surrounding stars -->
  <!-- top-left -->
  <circle cx="100" cy="80" r="22" fill="url(#sStarGlow)" opacity="0.6"/>
  <path d="M100 68 L103 78 L113 80 L103 82 L100 92 L97 82 L87 80 L97 78 Z" fill="#DDD6FE" fill-opacity="0.85"/>
  <!-- top-right -->
  <circle cx="305" cy="92" r="22" fill="url(#sStarGlow)" opacity="0.55"/>
  <path d="M305 81 L308 90 L317 92 L308 94 L305 103 L302 94 L293 92 L302 90 Z" fill="#DDD6FE" fill-opacity="0.82"/>
  <!-- mid-left -->
  <circle cx="78" cy="195" r="17" fill="url(#sStarGlow)" opacity="0.5"/>
  <path d="M78 187 L80 193 L86 195 L80 197 L78 203 L76 197 L70 195 L76 193 Z" fill="#DDD6FE" fill-opacity="0.75"/>
  <!-- mid-right -->
  <circle cx="330" cy="205" r="18" fill="url(#sStarGlow)" opacity="0.5"/>
  <path d="M330 196 L332 203 L339 205 L332 207 L330 214 L328 207 L321 205 L328 203 Z" fill="#DDD6FE" fill-opacity="0.75"/>
  <!-- lower-left -->
  <circle cx="148" cy="262" r="14" fill="url(#sStarGlow)" opacity="0.42"/>
  <path d="M148 255 L149.5 261 L155 262 L149.5 263 L148 269 L146.5 263 L141 262 L146.5 261 Z" fill="#DDD6FE" fill-opacity="0.65"/>
  <!-- lower-right -->
  <circle cx="262" cy="268" r="14" fill="url(#sStarGlow)" opacity="0.42"/>
  <path d="M262 261 L263.5 267 L269 268 L263.5 269 L262 275 L260.5 269 L255 268 L260.5 267 Z" fill="#DDD6FE" fill-opacity="0.65"/>

  <!-- Background tiny stars -->
  <g fill="#DDD6FE">
    <circle cx="40"  cy="40"  r="1.5" fill-opacity="0.5"/>
    <circle cx="355" cy="42"  r="1.5" fill-opacity="0.5"/>
    <circle cx="60"  cy="125" r="1"   fill-opacity="0.4"/>
    <circle cx="370" cy="138" r="1"   fill-opacity="0.4"/>
    <circle cx="30"  cy="220" r="1.2" fill-opacity="0.35"/>
    <circle cx="378" cy="245" r="1"   fill-opacity="0.35"/>
    <circle cx="180" cy="42"  r="1"   fill-opacity="0.4"/>
    <circle cx="242" cy="52"  r="1"   fill-opacity="0.35"/>
    <circle cx="92"  cy="318" r="1"   fill-opacity="0.3"/>
    <circle cx="312" cy="322" r="1"   fill-opacity="0.3"/>
    <circle cx="200" cy="340" r="1.5" fill-opacity="0.4"/>
    <circle cx="48"  cy="360" r="1"   fill-opacity="0.25"/>
    <circle cx="352" cy="370" r="1"   fill-opacity="0.25"/>
    <circle cx="220" cy="370" r="0.8" fill-opacity="0.22"/>
    <circle cx="138" cy="358" r="0.8" fill-opacity="0.22"/>
  </g>

  <!-- Corner bracket (bottom-left) -->
  <path d="M10 380 L10 400 L30 400" fill="none" stroke="#A78BFA" stroke-opacity="0.32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
