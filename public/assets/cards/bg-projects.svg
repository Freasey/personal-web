<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pBgA" cx="72%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pBgB" cx="18%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pCardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="pCardMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pCardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mesh gradient base -->
  <rect width="400" height="400" fill="url(#pBgA)"/>
  <rect width="400" height="400" fill="url(#pBgB)"/>

  <!-- Faint background grid -->
  <g stroke="#34D399" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="80"  x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80"  y1="0" x2="80"  y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Layered project deck -->
  <!-- Back card -->
  <g transform="translate(232 52) rotate(9)">
    <rect width="135" height="100" rx="12" fill="url(#pCardBack)" stroke="#34D399" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="18" cy="18" r="3" fill="#34D399" fill-opacity="0.4"/>
    <circle cx="30" cy="18" r="3" fill="#34D399" fill-opacity="0.26"/>
    <circle cx="42" cy="18" r="3" fill="#34D399" fill-opacity="0.16"/>
    <rect x="15" y="40" width="80" height="4" rx="2" fill="#34D399" fill-opacity="0.2"/>
    <rect x="15" y="52" width="55" height="3" rx="1.5" fill="#34D399" fill-opacity="0.12"/>
    <rect x="15" y="68" width="40" height="14" rx="3" fill="#34D399" fill-opacity="0.18"/>
  </g>

  <!-- Middle card -->
  <g transform="translate(140 90) rotate(2)">
    <rect width="160" height="115" rx="13" fill="url(#pCardMid)" stroke="#34D399" stroke-opacity="0.32" stroke-width="1.1"/>
    <circle cx="20" cy="20" r="3.2" fill="#34D399" fill-opacity="0.55"/>
    <circle cx="32" cy="20" r="3.2" fill="#34D399" fill-opacity="0.38"/>
    <circle cx="44" cy="20" r="3.2" fill="#34D399" fill-opacity="0.22"/>
    <rect x="17" y="42" width="100" height="5" rx="2" fill="#34D399" fill-opacity="0.3"/>
    <rect x="17" y="54" width="78" height="4" rx="2" fill="#34D399" fill-opacity="0.2"/>
    <rect x="17" y="64" width="60" height="4" rx="2" fill="#34D399" fill-opacity="0.14"/>
    <rect x="17" y="82" width="50" height="20" rx="5" fill="#34D399" fill-opacity="0.32"/>
    <rect x="73" y="82" width="50" height="20" rx="5" fill="#34D399" fill-opacity="0.18"/>
  </g>

  <!-- Front card -->
  <g transform="translate(45 145) rotate(-5)">
    <rect width="180" height="130" rx="14" fill="url(#pCardFront)" stroke="#34D399" stroke-opacity="0.52" stroke-width="1.4"/>
    <circle cx="22" cy="22" r="4" fill="#6EE7B7" fill-opacity="0.8"/>
    <circle cx="36" cy="22" r="4" fill="#34D399" fill-opacity="0.5"/>
    <circle cx="50" cy="22" r="4" fill="#34D399" fill-opacity="0.32"/>
    <rect x="18" y="48" width="115" height="6" rx="3" fill="#6EE7B7" fill-opacity="0.5"/>
    <rect x="18" y="62" width="90"  height="4" rx="2" fill="#34D399" fill-opacity="0.3"/>
    <rect x="18" y="74" width="128" height="4" rx="2" fill="#34D399" fill-opacity="0.22"/>
    <rect x="18" y="96" width="55"  height="20" rx="5" fill="#6EE7B7" fill-opacity="0.42"/>
    <rect x="80" y="96" width="55"  height="20" rx="5" fill="#34D399" fill-opacity="0.22"/>
  </g>

  <!-- Glow accents -->
  <circle cx="345" cy="58" r="38" fill="url(#pGlow)"/>
  <circle cx="345" cy="58" r="4" fill="#6EE7B7" fill-opacity="0.95"/>
  <circle cx="345" cy="58" r="10" fill="none" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="1.1"/>
  <circle cx="345" cy="58" r="20" fill="none" stroke="#34D399" stroke-opacity="0.18" stroke-width="0.8"/>

  <!-- Subtle accent curves -->
  <g fill="none" stroke="#34D399" stroke-linecap="round">
    <path d="M -10 320 Q 100 286 200 308 T 410 290" stroke-opacity="0.16" stroke-width="1"/>
    <path d="M -10 345 Q 120 310 220 332 T 410 315" stroke-opacity="0.1" stroke-width="0.8"/>
  </g>

  <!-- Floating particles -->
  <g fill="#34D399">
    <circle cx="40"  cy="50"  r="1.5" fill-opacity="0.45"/>
    <circle cx="90"  cy="40"  r="1"   fill-opacity="0.3"/>
    <circle cx="380" cy="140" r="1.5" fill-opacity="0.35"/>
    <circle cx="20"  cy="180" r="1"   fill-opacity="0.28"/>
    <circle cx="60"  cy="230" r="1.2" fill-opacity="0.25"/>
    <circle cx="370" cy="260" r="1.2" fill-opacity="0.22"/>
    <circle cx="385" cy="335" r="1"   fill-opacity="0.18"/>
    <circle cx="190" cy="370" r="1"   fill-opacity="0.15"/>
  </g>

  <!-- Corner bracket (bottom-left) -->
  <path d="M10 380 L10 400 L30 400" fill="none" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
